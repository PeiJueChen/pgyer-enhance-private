<div class="container">
  <img src="assets/images/aigens.png" class="header-logo" />

  <div class="pwd-container" *ngIf="showPasswordForm">
    <h2 class="title">Aigens App Downloader</h2>
    <p class="sub-title">This app needs password to install. Please enter the password.</p>
    <form (ngSubmit)="onSubmit()" #passwordForm="ngForm">
      <div class="form-group">
        <input type="number" id="password" name="password" [(ngModel)]="password" required class="form-control">
        <div *ngIf="password && password != appDataService.currentAppInfo.buildPassword" class="error-message">
          Password is incorrect.
        </div>
      </div>
      <button type="submit" class="btn btn-primary submit-button">Enter</button>

      <div *ngIf="qrcodeUrl" class="qrcode-container">
        <span>Use your mobile to scan the QR code to install </span>
        <div class="qrcode">
          <img [src]="qrcodeUrl">
          <img *ngIf="appIcon" [src]="appIcon" class="qr-logo" />
        </div>
      </div>
    </form>
  </div>

  <div class="content" *ngIf="!showPasswordForm">
      <p *ngIf="!appDataService.realVerions?.length" class="loading">loading</p>

      <div *ngIf="appDataService.realVerions?.length" class="app-list" [ngClass]="{'ios-list': p.IOS}">
        <app-app-header-item></app-app-header-item>
        <app-app-item></app-app-item>
      </div>
  </div>

</div>
