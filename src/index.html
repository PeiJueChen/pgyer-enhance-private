<!doctype html>
<html lang="en" style="-webkit-overflow-scrolling: auto;">

<head>
  <meta charset="utf-8">
  <title>PgyerEnhance</title>
  <base href="/">
  <!-- <meta name="viewport"
    content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /> -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link id="app-version">
  </link>
  <script>
    function supportsViewportFit() {
      const testElement = document.createElement('div');
      testElement.style.setProperty('display', 'block');
      testElement.style.setProperty('position', 'absolute');
      testElement.style.setProperty('top', '0');
      testElement.style.setProperty('left', '0');
      document.body.appendChild(testElement);

      const supportsFit = getComputedStyle(testElement).position === 'absolute';
      document.body.removeChild(testElement);

      return supportsFit;
    }
    function setViewport(isOld) {
      const viewport = document.createElement('meta');
      viewport.name = 'viewport';
      var co = isOld ? 'width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no' : 'viewport-fit=cover, width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no';
      viewport.content = co;


      document.getElementsByTagName('head')[0].appendChild(viewport);
    }

    window.addEventListener('load', function () {
      if (supportsViewportFit()) {
        setViewport(false); // 支持，使用 viewport-fit=cover
      } else {
        setViewport(true); // 不支持，使用适合旧版的设置
      }
    })
  </script>

  <script>
      (function (d) {
        script = d.createElement('script');
        script.type = 'text/javascript';
        script.defer = true;
        script.onload = function () {
          if (window['bootstrap']) window['bootstrap']();
        };
        script.onerror = function () {
          document.getElementById("reload").style.display = "block";
          if (document.getElementById('unsupported-browser')) {
            document.getElementById('unsupported-browser').style.display = 'none';
          }
        };

        const hostList = {};

        var referer = location.href;
        var uat = "http://localhost:5001/pgyer-enhance/us-central1/appdownload/init";
        var prd = "https://us-central1-aigensstoretest.cloudfunctions.net/appdownload/init";
        const host = location.hostname;
        var url = (host == 'localhost' || host.startsWith('192.168.')) ? uat : prd;
        script.src = url + "?referer=" + encodeURIComponent(referer);
        d.getElementsByTagName('head')[0].appendChild(script);

        // document.addEventListener('visibilitychange', function () {
        //   if (!document.hidden) {
        //     location.reload();
        //   }
        // });

      }(document));

  </script>

  <script>
    function handleUnsupportedBrowsers() {
      var appRoot = document.getElementsByTagName('app-root')[0];
      if (appRoot && appRoot.innerHTML === '' && document.getElementById('unsupported-browser')) {
         document.getElementById('unsupported-browser').style.display = 'block';
      }
    }
  </script>

  <style>
    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      padding: 0;
      margin: 0;
    }

    .navbar-notch {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99;
      background-color: var(--P);
      height: constant(safe-area-inset-top);
      height: env(safe-area-inset-top);
      background-color: #16a085;
    }

    #reload {
      text-align: center;
      margin-top: 3rem;
    }
  </style>
</head>

<body onload="handleUnsupportedBrowsers()">
  <div class="navbar-notch"></div>
  <app-root></app-root>
  <div id="reload" style="display: none;">Please reload again</div>
  <div id="unsupported-browser" style="display: none;">
    <h1>Unsupported Browser (too old)</h1>
    <p>Please use a modern browser!</p>
  </div>
</body>

</html>
