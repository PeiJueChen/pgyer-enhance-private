<!doctype html>
<html lang="en" style="-webkit-overflow-scrolling: auto;">

<head>
  <meta charset="utf-8">
  <title>PgyerEnhance</title>
  <base href="/">
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <script>
    (function (d) {
      script = d.createElement('script');
      script.type = 'text/javascript';
      script.defer = true;
      script.onload = function () {
        if (window['bootstrap']) window['bootstrap']();
      };
      script.onerror = function () {
        document.getElementById("reload").style.display = "block";
      };

      const hostList = {};

      var referer = location.href;
      var uat = "http://localhost:5001/pgyer-enhance/us-central1/appdownload/init";
      var prd = "https://us-central1-aigensstoretest.cloudfunctions.net/appdownload/init";
      const host = location.hostname;
      var url = (host == 'localhost' || host.startsWith('192.168.')) ? uat : prd;
      script.src = url + "?referer=" + encodeURIComponent(referer);
      d.getElementsByTagName('head')[0].appendChild(script);

      // document.addEventListener('visibilitychange', function () {
      //   if (!document.hidden) {
      //     location.reload();
      //   }
      // });

    }(document));

  </script>


  <style>
    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      padding: 0;
      margin: 0;
    }

    .navbar-notch {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99;
      background-color: var(--P);
      height: constant(safe-area-inset-top);
      height: env(safe-area-inset-top);
      background-color: #16a085;
    }

    #reload {
      text-align: center;
      margin-top: 3rem;
    }
  </style>
</head>

<body>
  <div class="navbar-notch"></div>
  <app-root></app-root>
  <div id="reload" style="display: none;">Please reload again</div>
</body>

</html>
